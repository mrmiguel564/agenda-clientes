name: agenda-vet

# Desarrollo local: el mismo Worker que corre en Cloudflare, con D1 local (wrangler dev).
# Producción: Cloudflare Workers Builds despliega desde GitHub (ver README).
services:
  app:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npx wrangler dev --ip 0.0.0.0 --port 8787 --persist-to .wrangler/state"
    environment:
      WRANGLER_SEND_METRICS: "false"
    ports:
      - "${APP_PORT:-3000}:8787"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      - mailpit

  # SMTP de desarrollo: captura todos los correos. UI en http://localhost:8025 (solo este equipo)
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  node_modules:
